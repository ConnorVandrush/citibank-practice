version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd citibank-practice-frontend
      - npm ci

  build:
    commands:
      - npm run build

  post_build:
    commands:
      - aws s3 sync dist/ s3://citibank-practice-frontend/ --delete
      - aws cloudfront create-invalidation --distribution-id E2K4MU9ZD8J7XK --paths "/*"

artifacts:
  files:
    - "**/*"
  base-directory: citibank-practice-frontend/dist
