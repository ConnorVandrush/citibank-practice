version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/citibank-practice-backend-employees
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - IMAGE_URI=$REPOSITORY_URI:$IMAGE_TAG

      - echo Repository URI is $REPOSITORY_URI
      - echo Image tag is $IMAGE_TAG
      - echo Image URI is $IMAGE_URI

  build:
    commands:
      - echo Building Docker image...
      - docker build -t $IMAGE_URI citibank-practice-backend/employees

  post_build:
    commands:
      - echo Checking whether image already exists in ECR...
      - |
        if aws ecr describe-images --repository-name citibank-practice-backend-employees --image-ids imageTag=$IMAGE_TAG --region $AWS_DEFAULT_REGION > /dev/null 2>&1; then
          echo "Image $IMAGE_TAG already exists in ECR. Skipping push."
        else
          echo "Image $IMAGE_TAG does not exist. Pushing to ECR..."
          docker push $IMAGE_URI
        fi

      - echo Creating imagedefinitions.json...
      - printf '[{"name":"employees","imageUri":"%s"}]' "$IMAGE_URI" > imagedefinitions.json
      - cat imagedefinitions.json
      - echo Build completed successfully.

artifacts:
  files:
    - imagedefinitions.json
